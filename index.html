<!DOCTYPE html>
<html lang="en" id="rootEl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c3a">
<title>Weekly Work Tracker</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f2f4f7;--card:#ffffff;--text:#14181f;--muted:#6b7280;--line:#e5e7eb;
  --accent:#0e7c3a;--accent-soft:#e6f4ec;--blue:#0a5fd7;--blue-soft:#e8f0fe;
  --danger:#d92d20;--danger-soft:#fdecea;--radius:14px;--shadow:0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1115;--card:#171b22;--text:#f2f4f7;--muted:#9aa3b2;--line:#262c36;
    --accent:#34c77b;--accent-soft:#123626;--blue:#5b9bff;--blue-soft:#16294d;
    --danger:#ff6b61;--danger-soft:#3d1a17;--shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="light"]{
  --bg:#f2f4f7;--card:#ffffff;--text:#14181f;--muted:#6b7280;--line:#e5e7eb;
  --accent:#0e7c3a;--accent-soft:#e6f4ec;--blue:#0a5fd7;--blue-soft:#e8f0fe;
  --danger:#d92d20;--danger-soft:#fdecea;--shadow:0 1px 3px rgba(16,24,40,.08);
}
:root[data-theme="dark"]{
  --bg:#0f1115;--card:#171b22;--text:#f2f4f7;--muted:#9aa3b2;--line:#262c36;
  --accent:#34c77b;--accent-soft:#123626;--blue:#5b9bff;--blue-soft:#16294d;
  --danger:#ff6b61;--danger-soft:#3d1a17;--shadow:0 1px 3px rgba(0,0,0,.4);
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom);}
.wrap{max-width:640px;margin:0 auto;padding:0 12px}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:12px;padding-bottom:12px}
.app-title{font-size:18px;font-weight:700;margin:0}
.app-sub{font-size:12px;color:var(--muted);font-weight:600}
nav.tabs{position:sticky;top:57px;z-index:19;background:var(--card);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;padding-top:6px;padding-bottom:6px;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tabbtn{flex:0 0 auto;white-space:nowrap;border:0;background:transparent;color:var(--muted);
  font-size:13px;font-weight:600;padding:10px 12px;cursor:pointer;border-bottom:2px solid transparent}
.tabbtn.active{color:var(--accent);border-bottom-color:var(--accent)}
main{padding-top:14px;padding-bottom:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card .label{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.card .big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.card .sub{font-size:13px;color:var(--muted);margin-top:4px}
.hero{background:linear-gradient(135deg,var(--accent),#0a5a2a);border:0;color:#fff}
.hero .label{color:rgba(255,255,255,.85)}
.hero .sub{color:rgba(255,255,255,.85)}
.row2{display:flex;gap:12px}
.row2>div{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row2 .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.row2 .k{font-size:12px;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.navrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.navbtns{display:flex;gap:8px}
.nbtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;
  padding:8px 14px;font-size:15px;font-weight:700;cursor:pointer}
.nbtn:active{transform:scale(.97)}
.weeklabel{font-size:15px;font-weight:700}
table.att{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);font-size:13px;overflow:hidden}
table.att th{background:var(--bg);color:var(--muted);font-size:11px;text-transform:uppercase;
  letter-spacing:.4px;padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
table.att td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.att tr:last-child td{border-bottom:0}
table.att tbody tr.taprow{cursor:pointer}
table.att tbody tr.taprow:active{background:var(--bg)}
.daycell{font-weight:700}
.daycell .dnum{display:block;font-size:11px;color:var(--muted);font-weight:600}
.tdnum{font-variant-numeric:tabular-nums;font-weight:600}
.plus1{display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:10px;font-weight:800;
  border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:middle}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;
  padding:10px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.seg button.on.paid{background:var(--accent-soft);color:var(--accent)}
.seg button.on.unpaid{background:var(--danger-soft);color:var(--danger)}
.badge{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:4px 12px}
.badge.paid{background:var(--accent-soft);color:var(--accent)}
.badge.unpaid{background:var(--danger-soft);color:var(--danger)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg);color:var(--text)}
.field input:focus,.field select:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;
  cursor:pointer;background:var(--accent);color:#fff}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.btn.danger-ghost{background:var(--danger-soft);color:var(--danger);border:1px solid transparent}
.btnrow{display:flex;gap:10px;margin-top:12px}
.btnrow .btn{margin-top:0}
.linkbtn{border:0;background:none;color:var(--blue);font-size:14px;font-weight:700;cursor:pointer;padding:8px 4px}
.entry{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;
  border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .meta{min-width:0}
.entry .t1{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .t2{font-size:12px;color:var(--muted)}
.entry .amt{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.delbtn{border:0;background:var(--danger-soft);color:var(--danger);border-radius:8px;
  padding:7px 10px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0}
.autotag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:800;
  border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px}
h2.sec{font-size:17px;margin:4px 0 10px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.radio-row{display:flex;gap:8px;flex-wrap:wrap}
/* bottom sheet */
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;opacity:0;
  pointer-events:none;transition:opacity .2s}
.sheet-back.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);
  border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s ease;
  max-height:90vh;overflow-y:auto;box-shadow:0 -4px 24px rgba(0,0,0,.18)}
.sheet.open{transform:translateY(0)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 4px}
.sheet h3{margin:6px 0 14px;font-size:18px}
.previewbox{background:var(--bg);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-bottom:14px;text-align:center}
.previewbox .pv{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.previewbox .pk{font-size:12px;color:var(--muted);font-weight:600}
.morewrap{border-top:1px solid var(--line);margin-top:14px;padding-top:6px}
/* month rows */
.mrow{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);
  margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.mrow-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:13px 14px;cursor:pointer;width:100%;border:0;background:var(--card);color:var(--text);
  font-size:15px;text-align:left}
.mrow-head:active{background:var(--bg)}
.mrow-head .wl{font-weight:700}
.mrow-head .wv{font-variant-numeric:tabular-nums;font-weight:700}
.mrow-head .wk{font-size:12px;color:var(--muted);font-weight:600}
.mrow-body{border-top:1px solid var(--line);padding:6px 14px 12px}
.mini{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.mini:last-child{border-bottom:0}
.mini .md{font-weight:700}
.mini .mv{font-variant-numeric:tabular-nums;color:var(--muted)}
/* print */
#printReport{display:none}
@media print{
  header.top,nav.tabs,main,.sheet-back,.sheet{display:none !important}
  body{background:#fff;padding:0}
  #printReport{display:block;color:#000;font-family:Arial,Helvetica,sans-serif;padding:8px}
  #printReport h1{font-size:20px;margin:0 0 4px}
  #printReport h2{font-size:15px;margin:14px 0 6px}
  #printReport p.meta{font-size:12px;color:#444;margin:0 0 10px}
  #printReport table{width:100%;border-collapse:collapse;margin-bottom:10px}
  #printReport th,#printReport td{border:1px solid #999;padding:6px 8px;font-size:12px;text-align:left}
  #printReport th{background:#eee}
  #printReport .tot{font-weight:bold}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div><h1 class="app-title">Weekly Work Tracker</h1><div class="app-sub">Your hours, your pay — private to this browser</div></div>
</div></header>
<nav class="tabs"><div class="wrap" id="tabBar"></div></nav>
<main><div class="wrap" id="app"></div></main>
<div class="sheet-back" id="sheetBack" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="wrap" id="sheetBody" style="padding-bottom:calc(20px + env(safe-area-inset-bottom))"></div></div>
<div id="printReport"></div>
<script>
"use strict";
/* ============ constants & utils ============ */
var LS_KEY = "workTrackerDataV1";
var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var DAYS_S = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var MONTHS_S = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var EXPENSE_CATS = ["Food","Transport","Housing","Shopping"];

function pad(n){ return String(n).padStart(2,"0"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8); }
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseKey(k){ var p=String(k).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function weekStartOf(d, ws){ var x=new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var diff=(x.getDay()-ws+7)%7; x.setDate(x.getDate()-diff); return x; }
function weekKeyOf(d, ws){ return dateKey(weekStartOf(d, ws)); }
function monthKeyOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function toMin(hhmm){ if(!hhmm) return null; var p=hhmm.split(":"); return (+p[0])*60+(+p[1]); }

/* 12-hour AM/PM display */
function fmtTime12(hhmm){
  if(!hhmm) return "–";
  var p=hhmm.split(":"), h=+p[0], m=+p[1];
  var ap = h>=12 ? "PM" : "AM";
  h = h%12; if(h===0) h=12;
  return h+":"+pad(m)+" "+ap;
}
function fmtDur(mins){
  mins=Math.max(0,Math.round(mins));
  var h=Math.floor(mins/60), m=mins%60;
  return h+"h "+m+"m";
}
/* minutes + pay for one entry; end <= start counts as next day */
function dayCalc(entry, rate){
  if(!entry || !entry.start || !entry.end) return null;
  var s=toMin(entry.start), e=toMin(entry.end), overnight=false;
  if(e<=s){ e+=1440; overnight=true; }
  var mins=Math.max(0, e-s-(+entry.breakMinutes||0));
  return { mins:mins, pay:round2(mins/60*(+rate||0)), overnight:overnight };
}
function fmtMoney(n){
  var v=Number(n)||0;
  return (S.settings.currencySymbol||"$") + v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function weekLabel(wsDate){
  var e=addDays(wsDate,6);
  return MONTHS_S[wsDate.getMonth()]+" "+wsDate.getDate()+" – "+MONTHS_S[e.getMonth()]+" "+e.getDate()+", "+e.getFullYear();
}
function monthLabel(mk){
  var p=mk.split("-"); return MONTHS[+p[1]-1]+" "+p[0];
}
function downloadFile(name, content, mime){
  var blob=new Blob([content],{type:mime||"text/plain"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},5000);
}
function csvEsc(v){ v=String(v==null?"":v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }

/* ============ state ============ */
function defaultState(){
  return {
    version:1,
    work:[], income:[], expenses:[], weekPayStatus:{},
    settings:{ currencySymbol:"$", hourlyRate:14, weekStart:1, theme:"system" }
  };
}
function normalize(d){
  var base=defaultState();
  if(!d||typeof d!=="object") return base;
  var s=d.settings||{};
  base.work=Array.isArray(d.work)?d.work:[];
  base.income=Array.isArray(d.income)?d.income:[];
  base.expenses=Array.isArray(d.expenses)?d.expenses:[];
  base.weekPayStatus=(d.weekPayStatus&&typeof d.weekPayStatus==="object")?d.weekPayStatus:{};
  base.settings.currencySymbol=typeof s.currencySymbol==="string"&&s.currencySymbol?s.currencySymbol:"$";
  base.settings.hourlyRate=+s.hourlyRate>0?+s.hourlyRate:14;
  base.settings.weekStart=(s.weekStart>=0&&s.weekStart<=6)?s.weekStart:1;
  base.settings.theme=(s.theme==="light"||s.theme==="dark")?s.theme:"system";
  return base;
}
function load(){
  try{ var raw=localStorage.getItem(LS_KEY); if(!raw) return null;
    return normalize(JSON.parse(raw)); }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

var S = load() || defaultState();
var ui = { tab:"home", weekOffset:0, workMode:"weekly", monthOffset:0, expandedMonthWeek:null };
var sheet = null; /* {date,start,end,breakMinutes,rate,editingId,showMore} */

/* ============ week / pay logic ============ */
function weekEntries(wk){
  var ws=S.settings.weekStart;
  return S.work.filter(function(w){ return weekKeyOf(parseKey(w.date), ws)===wk; });
}
function weekTotals(wk){
  var mins=0, pay=0, rate=S.settings.hourlyRate;
  weekEntries(wk).forEach(function(w){
    var c=dayCalc(w, w.rate!=null?w.rate:rate);
    if(c){ mins+=c.mins; pay+=c.pay; }
  });
  return { mins:mins, pay:round2(pay) };
}
function weekStatus(wk){ return S.weekPayStatus[wk]==="paid" ? "paid" : "unpaid"; }
/* keep the auto Salary income in sync with a week's paid status + totals */
function syncPaidWeek(wk){
  var idx=-1;
  for(var i=0;i<S.income.length;i++){
    if(S.income[i].source==="work-week"&&S.income[i].sourceKey===wk){ idx=i; break; }
  }
  var t=weekTotals(wk);
  if(S.weekPayStatus[wk]==="paid" && t.pay>0){
    var entry={ id: idx>=0?S.income[idx].id:uid(), amount:t.pay, category:"Salary",
      date:wk, note:"Week of "+weekLabel(parseKey(wk)), source:"work-week", sourceKey:wk };
    if(idx>=0) S.income[idx]=entry; else S.income.push(entry);
  } else if(idx>=0){ S.income.splice(idx,1); }
}
function setWeekPaid(wk, st){
  S.weekPayStatus[wk]=st; syncPaidWeek(wk); save(); render();
}
function dispWeekStart(){
  return addDays(weekStartOf(new Date(), S.settings.weekStart), ui.weekOffset*7);
}
function entryForDate(dk){
  for(var i=0;i<S.work.length;i++) if(S.work[i].date===dk) return S.work[i];
  return null;
}

/* ============ chrome ============ */
function applyTheme(){
  var th=S.settings.theme, root=document.getElementById("rootEl");
  if(th==="system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", th);
}
function renderChrome(){
  var tabs=[["home","Home"],["work","Work"],["money","Money"],["settings","Settings"]];
  document.getElementById("tabBar").innerHTML = tabs.map(function(x){
    return '<button class="tabbtn'+(ui.tab===x[0]?" active":"")+'" onclick="setTab(\''+x[0]+'\')">'+x[1]+'</button>';
  }).join("");
}
function setTab(x){ ui.tab=x; closeSheet(); render(); window.scrollTo(0,0); }
function render(){
  applyTheme(); renderChrome();
  var v={home:vHome,work:vWork,money:vMoney,settings:vSettings}[ui.tab];
  document.getElementById("app").innerHTML=v();
}

/* ============ HOME ============ */
function vHome(){
  var wk=weekKeyOf(new Date(), S.settings.weekStart);
  var t=weekTotals(wk), st=weekStatus(wk);
  var todayKey=dateKey(new Date());
  var todayE=entryForDate(todayKey);
  var todayTxt=todayE ? fmtTime12(todayE.start)+" – "+fmtTime12(todayE.end) : "Not logged yet";
  return ''+
  '<div class="card hero"><div class="label">This week · '+esc(weekLabel(parseKey(wk)))+'</div>'+
    '<div class="big">'+fmtDur(t.mins)+'</div>'+
    '<div class="sub">'+fmtMoney(t.pay)+' · <b style="text-transform:uppercase">'+st+'</b></div></div>'+
  '<div class="card"><div class="label">Today</div>'+
    '<div style="font-size:17px;font-weight:700;margin-bottom:12px">'+esc(todayTxt)+'</div>'+
    '<button class="btn" onclick="openSheet(\''+todayKey+'\')">Add hours</button></div>'+
  '<div class="card"><div class="label">Unpaid weeks</div>'+unpaidWeeksHtml()+'</div>';
}
function unpaidWeeksHtml(){
  var ws=S.settings.weekStart, seen={}, rows=[];
  S.work.forEach(function(w){
    var wk=weekKeyOf(parseKey(w.date), ws);
    if(S.weekPayStatus[wk]!=="paid" && !seen[wk]){ seen[wk]=1; rows.push(wk); }
  });
  rows.sort();
  if(!rows.length) return '<div class="empty" style="padding:8px">All caught up 🎉</div>';
  return rows.map(function(wk){
    var t=weekTotals(wk);
    return '<div class="entry"><div class="meta"><div class="t1">'+esc(weekLabel(parseKey(wk)))+'</div>'+
      '<div class="t2">'+fmtDur(t.mins)+'</div></div>'+
      '<div style="display:flex;align-items:center;gap:8px"><span class="amt">'+fmtMoney(t.pay)+'</span>'+
      '<button class="nbtn" style="padding:6px 12px;font-size:13px" onclick="setWeekPaid(\''+wk+'\',\'paid\')">Mark paid</button></div></div>';
  }).join("");
}

/* ============ WORK ============ */
function vWork(){
  return '<div class="card" style="padding:8px"><div class="seg">'+
    '<button class="'+(ui.workMode==="weekly"?"on":"")+'" onclick="setWorkMode(\'weekly\')">Weekly</button>'+
    '<button class="'+(ui.workMode==="monthly"?"on":"")+'" onclick="setWorkMode(\'monthly\')">Monthly</button>'+
    '</div></div>'+
    (ui.workMode==="weekly" ? vWorkWeekly() : vWorkMonthly());
}
function setWorkMode(m){ ui.workMode=m; ui.expandedMonthWeek=null; render(); }

function vWorkWeekly(){
  var wsDate=dispWeekStart(), ws=S.settings.weekStart, rate=S.settings.hourlyRate;
  var wk=weekKeyOf(wsDate, ws), st=weekStatus(wk), t=weekTotals(wk);
  var rows="";
  for(var i=0;i<7;i++){
    var d=addDays(wsDate,i), dk=dateKey(d), e=entryForDate(dk);
    var c=e?dayCalc(e, e.rate!=null?e.rate:rate):null;
    var tm=c?fmtDur(c.mins):"–", py=c?fmtMoney(c.pay):"–";
    var stt=e?fmtTime12(e.start):"–", en=e?fmtTime12(e.end):"–";
    var badge=(c&&c.overnight)?'<span class="plus1" title="Ends next day">+1</span>':"";
    rows+='<tr class="taprow" onclick="openSheet(\''+dk+'\')">'+
      '<td><span class="daycell">'+DAYS[d.getDay()]+'<span class="dnum">'+(d.getMonth()+1)+"/"+d.getDate()+'</span></span></td>'+
      '<td>'+stt+'</td><td>'+en+badge+'</td>'+
      '<td class="tdnum">'+tm+'</td><td class="tdnum">'+py+'</td></tr>';
  }
  return ''+
  '<div class="navrow"><div class="navbtns">'+
    '<button class="nbtn" onclick="weekNav(-1)">‹</button>'+
    '<button class="nbtn" onclick="goToday()">This week</button>'+
    '<button class="nbtn" onclick="weekNav(1)">›</button></div>'+
    '<div class="weeklabel">'+esc(weekLabel(wsDate))+'</div></div>'+
  '<div class="card"><div class="label">Week status</div>'+
    '<div class="seg" style="margin-bottom:12px">'+
      '<button class="'+(st==="paid"?"on paid":"")+'" onclick="setWeekPaid(\''+wk+'\',\'paid\')">Paid</button>'+
      '<button class="'+(st==="unpaid"?"on unpaid":"")+'" onclick="setWeekPaid(\''+wk+'\',\'unpaid\')">Unpaid</button></div>'+
    '<div class="row2"><div><div class="v">'+fmtDur(t.mins)+'</div><div class="k">Total time</div></div>'+
    '<div><div class="v">'+fmtMoney(t.pay)+'</div><div class="k">Total pay</div></div></div>'+
    '<div class="btnrow"><button class="btn" onclick="openSheet(\''+dateKey(new Date())+'\')">Add hours</button></div>'+
    '<div class="btnrow"><button class="btn ghost" onclick="exportWeekCSV(\''+wk+'\')">Export CSV</button>'+
    '<button class="btn ghost" onclick="printWeek(\''+wk+'\')">Print / PDF</button></div>'+
    '<div style="text-align:center;margin-top:6px"><button class="linkbtn" style="color:var(--danger)" '+
    'onclick="clearWeek(\''+wk+'\')">Clear this week</button></div></div>'+
  '<table class="att"><thead><tr><th>Day</th><th>Start</th><th>End</th><th>Time</th><th>Pay</th></tr></thead>'+
  '<tbody>'+rows+'</tbody></table>'+
  '<div class="note">Tap a day to add or edit its hours.</div>';
}
function weekNav(n){ ui.weekOffset+=n; render(); }
function goToday(){ ui.weekOffset=0; render(); }
function clearWeek(wk){
  if(!confirm("Clear all shifts for the week of "+weekLabel(parseKey(wk))+"?")) return;
  var ws=S.settings.weekStart;
  S.work=S.work.filter(function(w){ return weekKeyOf(parseKey(w.date), ws)!==wk; });
  delete S.weekPayStatus[wk];
  syncPaidWeek(wk);
  save(); render();
}

/* ---- monthly view (inside Work) ---- */
function dispMonthDate(){
  var n=new Date(); return new Date(n.getFullYear(), n.getMonth()+ui.monthOffset, 1);
}
function monthWeeks(mk){
  var ws=S.settings.weekStart, p=mk.split("-");
  var first=new Date(+p[0], +p[1]-1, 1), last=new Date(+p[0], +p[1], 0);
  var out=[], cur=weekStartOf(first, ws), guard=0;
  while(cur<=last && guard<8){
    var wk=dateKey(cur), t=weekTotals(wk);
    var has=S.work.some(function(w){ return weekKeyOf(parseKey(w.date), ws)===wk; });
    if(has) out.push({wk:wk, mins:t.mins, pay:t.pay, status:weekStatus(wk)});
    cur=addDays(cur,7); guard++;
  }
  return out;
}
function vWorkMonthly(){
  var mk=monthKeyOf(dispMonthDate());
  var weeks=monthWeeks(mk);
  var rows=weeks.length?weeks.map(function(w){
    var open=ui.expandedMonthWeek===w.wk;
    var body="";
    if(open){
      var wsDate=parseKey(w.wk), rate=S.settings.hourlyRate, det="";
      for(var i=0;i<7;i++){
        var d=addDays(wsDate,i), e=entryForDate(dateKey(d));
        var c=e?dayCalc(e, e.rate!=null?e.rate:rate):null;
        det+='<div class="mini"><span class="md">'+DAYS_S[d.getDay()]+' '+(d.getMonth()+1)+"/"+d.getDate()+'</span>'+
          '<span class="mv">'+(c?fmtTime12(e.start)+"–"+fmtTime12(e.end)+" · "+fmtDur(c.mins)+" · "+fmtMoney(c.pay):"–")+'</span></div>';
      }
      body='<div class="mrow-body">'+det+'</div>';
    }
    return '<div class="mrow"><button class="mrow-head" onclick="toggleMonthWeek(\''+w.wk+'\')">'+
      '<span><span class="wl">'+esc(weekLabel(parseKey(w.wk)))+'</span><br>'+
      '<span class="wk">'+(open?"Tap to collapse":"Tap for day details")+'</span></span>'+
      '<span style="text-align:right"><span class="wv">'+fmtDur(w.mins)+'<br>'+fmtMoney(w.pay)+'</span><br>'+
      '<span class="badge '+w.status+'">'+w.status+'</span></span></button>'+body+'</div>';
  }).join(""):'<div class="card"><div class="empty">No shifts this month yet.</div></div>';
  var totM=0, totP=0;
  weeks.forEach(function(w){ totM+=w.mins; totP+=w.pay; });
  return ''+
  '<div class="navrow"><div class="navbtns">'+
    '<button class="nbtn" onclick="monthNav(-1)">‹</button>'+
    '<button class="nbtn" onclick="monthNav(1)">›</button></div>'+
    '<div class="weeklabel">'+esc(monthLabel(mk))+'</div></div>'+
  '<div class="card"><div class="row2">'+
    '<div><div class="v">'+fmtDur(totM)+'</div><div class="k">Month time</div></div>'+
    '<div><div class="v">'+fmtMoney(totP)+'</div><div class="k">Month pay</div></div></div>'+
    '<div class="btnrow"><button class="btn ghost" onclick="exportMonthCSV(\''+mk+'\')">Export CSV</button>'+
    '<button class="btn ghost" onclick="printMonth(\''+mk+'\')">Print / PDF</button></div></div>'+
  rows;
}
function monthNav(n){ ui.monthOffset+=n; ui.expandedMonthWeek=null; render(); }
function toggleMonthWeek(wk){ ui.expandedMonthWeek = ui.expandedMonthWeek===wk?null:wk; render(); }

/* ============ MONEY ============ */
function vMoney(){
  var inc=0, exp=0;
  S.income.forEach(function(e){ inc+=+e.amount||0; });
  S.expenses.forEach(function(e){ exp+=+e.amount||0; });
  var incRows=S.income.length?S.income.slice().sort(function(a,b){return a.date<b.date?1:-1;}).map(function(e){
    var auto=e.source==="work-week";
    return '<div class="entry"><div class="meta"><div class="t1">'+esc(e.category)+
      (auto?'<span class="autotag">AUTO</span>':"")+'</div>'+
      '<div class="t2">'+esc(e.note||e.date)+'</div></div>'+
      '<span class="amt">'+fmtMoney(e.amount)+'</span></div>';
  }).join(""):'<div class="empty">No income yet — mark a week Paid in the Work tab.</div>';
  var expRows=S.expenses.length?S.expenses.slice().sort(function(a,b){return a.date<b.date?1:-1;}).map(function(e){
    return '<div class="entry"><div class="meta"><div class="t1">'+esc(e.category)+'</div>'+
      '<div class="t2">'+esc(e.date)+(e.note?" · "+esc(e.note):"")+'</div></div>'+
      '<div style="display:flex;align-items:center;gap:8px"><span class="amt">'+fmtMoney(e.amount)+'</span>'+
      '<button class="delbtn" onclick="delExpense(\''+e.id+'\')">✕</button></div></div>';
  }).join(""):'<div class="empty">No expenses yet.</div>';
  var catOpts=EXPENSE_CATS.map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+'</option>';}).join("");
  return ''+
  '<div class="card"><div class="row2">'+
    '<div><div class="v">'+fmtMoney(inc)+'</div><div class="k">Total income</div></div>'+
    '<div><div class="v">'+fmtMoney(exp)+'</div><div class="k">Total expenses</div></div></div>'+
    '<div class="row2" style="margin-top:12px"><div><div class="v">'+fmtMoney(round2(inc-exp))+'</div>'+
    '<div class="k">Balance</div></div></div></div>'+
  '<div class="card"><h2 class="sec">Income</h2>'+incRows+
    '<div class="note">Salary entries are added automatically when you mark a week Paid (Work tab). Switch a week back to Unpaid to remove its entry.</div></div>'+
  '<div class="card"><h2 class="sec">Add expense</h2>'+
    '<div class="field"><label>Amount</label>'+
      '<input id="expAmt" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></div>'+
    '<div class="field"><label>Category</label><select id="expCat">'+catOpts+'</select></div>'+
    '<div class="field"><label>Date</label><input id="expDate" type="date" value="'+dateKey(new Date())+'"></div>'+
    '<div class="field"><label>Note (optional)</label><input id="expNote" type="text" maxlength="80"></div>'+
    '<button class="btn" onclick="addExpense()">Add expense</button></div>'+
  '<div class="card"><h2 class="sec">Expenses</h2>'+expRows+'</div>';
}
function addExpense(){
  var amt=+document.getElementById("expAmt").value;
  if(!(amt>0)){ alert("Please enter an amount."); return; }
  S.expenses.push({id:uid(), amount:round2(amt),
    category:document.getElementById("expCat").value||"",
    date:document.getElementById("expDate").value||dateKey(new Date()),
    note:document.getElementById("expNote").value.trim()});
  save(); render();
}
function delExpense(id){
  if(!confirm("Delete this expense?")) return;
  S.expenses=S.expenses.filter(function(x){return x.id!==id;});
  save(); render();
}

/* ============ EXPORTS ============ */
function exportWeekCSV(wk){
  var wsDate=parseKey(wk), ws=S.settings.weekStart, rate=S.settings.hourlyRate;
  var lines=["Day,Date,Start,End,Break (min),Hours,Pay ("+(S.settings.currencySymbol||"$")+")"];
  var totM=0, totP=0;
  for(var i=0;i<7;i++){
    var d=addDays(wsDate,i), e=entryForDate(dateKey(d));
    var c=e?dayCalc(e, e.rate!=null?e.rate:rate):null;
    var hrs=c?round2(c.mins/60):0, pay=c?c.pay:0;
    totM+=c?c.mins:0; totP+=pay;
    lines.push([DAYS[d.getDay()],dateKey(d),e&&e.start?e.start:"",e&&e.end?e.end:"",
      e?+e.breakMinutes||0:0,hrs.toFixed(2),pay.toFixed(2)].map(csvEsc).join(","));
  }
  lines.push(["Total","","","","",round2(totM/60).toFixed(2),round2(totP).toFixed(2)].map(csvEsc).join(","));
  lines.push(["Status",weekStatus(wk)].map(csvEsc).join(","));
  downloadFile("work-week-"+wk+".csv", lines.join("\n"), "text/csv");
}
function exportMonthCSV(mk){
  var weeks=monthWeeks(mk);
  var lines=["Week,Hours,Pay ("+(S.settings.currencySymbol||"$")+"),Status"];
  var totM=0, totP=0;
  weeks.forEach(function(w){
    totM+=w.mins; totP+=w.pay;
    lines.push([weekLabel(parseKey(w.wk)),round2(w.mins/60).toFixed(2),round2(w.pay).toFixed(2),w.status].map(csvEsc).join(","));
  });
  lines.push(["Total",round2(totM/60).toFixed(2),round2(totP).toFixed(2),""].map(csvEsc).join(","));
  downloadFile("work-month-"+mk+".csv", lines.join("\n"), "text/csv");
}
function printWeek(wk){
  var wsDate=parseKey(wk), ws=S.settings.weekStart, rate=S.settings.hourlyRate, sym=S.settings.currencySymbol||"$";
  var t=weekTotals(wk), rows="";
  for(var i=0;i<7;i++){
    var d=addDays(wsDate,i), e=entryForDate(dateKey(d));
    var c=e?dayCalc(e, e.rate!=null?e.rate:rate):null;
    rows+="<tr><td>"+DAYS[d.getDay()]+"</td><td>"+dateKey(d)+"</td>"+
      "<td>"+(e?fmtTime12(e.start):"–")+"</td><td>"+(e?fmtTime12(e.end):"–")+"</td>"+
      "<td>"+(c?fmtDur(c.mins):"–")+"</td><td>"+(c?sym+c.pay.toFixed(2):"–")+"</td></tr>";
  }
  document.getElementById("printReport").innerHTML=
    "<h1>Weekly Work Report</h1><p class='meta'>"+esc(weekLabel(wsDate))+" · Status: "+weekStatus(wk).toUpperCase()+"</p>"+
    "<table><tr><th>Day</th><th>Date</th><th>Start</th><th>End</th><th>Time</th><th>Pay</th></tr>"+rows+
    "<tr class='tot'><td colspan='4'>Total</td><td>"+fmtDur(t.mins)+"</td><td>"+sym+t.pay.toFixed(2)+"</td></tr></table>";
  window.print();
}
function printMonth(mk){
  var weeks=monthWeeks(mk), sym=S.settings.currencySymbol||"$", rows="", totM=0, totP=0;
  weeks.forEach(function(w){
    totM+=w.mins; totP+=w.pay;
    rows+="<tr><td>"+esc(weekLabel(parseKey(w.wk)))+"</td><td>"+fmtDur(w.mins)+"</td>"+
      "<td>"+sym+w.pay.toFixed(2)+"</td><td>"+w.status+"</td></tr>";
  });
  document.getElementById("printReport").innerHTML=
    "<h1>Monthly Work Report</h1><p class='meta'>"+esc(monthLabel(mk))+"</p>"+
    "<table><tr><th>Week</th><th>Time</th><th>Pay</th><th>Status</th></tr>"+rows+
    "<tr class='tot'><td>Total</td><td>"+fmtDur(totM)+"</td><td>"+sym+round2(totP).toFixed(2)+"</td><td></td></tr></table>";
  window.print();
}

/* ============ SETTINGS ============ */
function vSettings(){
  var st=S.settings;
  var days=[0,1,2,3,4,5,6].map(function(i){
    return '<option value="'+i+'"'+(st.weekStart===i?" selected":"")+'>'+DAYS[i]+'</option>';
  }).join("");
  return ''+
  '<div class="card"><h2 class="sec">Hourly rate</h2>'+
    '<div class="field" style="margin:0"><input type="number" min="0" step="0.5" inputmode="decimal" value="'+st.hourlyRate+'" '+
      'onchange="onRate(this.value)"></div></div>'+
  '<div class="card"><h2 class="sec">Week starts on</h2>'+
    '<div class="field" style="margin:0"><select onchange="onWeekStart(this.value)">'+days+'</select></div></div>'+
  '<div class="card"><h2 class="sec">Currency symbol</h2>'+
    '<div class="field" style="margin:0"><input type="text" maxlength="4" value="'+esc(st.currencySymbol)+'" '+
      'onchange="onCurSym(this.value)"></div></div>'+
  '<div class="card"><h2 class="sec">Theme</h2><div class="seg">'+
    '<button class="'+(st.theme==="system"?"on":"")+'" onclick="setTheme(\'system\')">System</button>'+
    '<button class="'+(st.theme==="light"?"on":"")+'" onclick="setTheme(\'light\')">Light</button>'+
    '<button class="'+(st.theme==="dark"?"on":"")+'" onclick="setTheme(\'dark\')">Dark</button></div></div>'+
  '<div class="card"><h2 class="sec">Backup</h2>'+
    '<button class="btn" onclick="downloadBackup()">Download backup</button>'+
    '<div style="height:10px"></div>'+
    '<label class="btn ghost" style="text-align:center;cursor:pointer">Restore from file'+
      '<input type="file" accept="application/json,.json" style="display:none" onchange="restoreFile(this)"></label>'+
    '<div class="note">Your data is stored in this browser only (localStorage). Download a backup to keep a copy elsewhere.</div></div>';
}
function onRate(v){ var r=+v; if(r>0){ S.settings.hourlyRate=r; resyncAllPaid(); save(); render(); } }
function onWeekStart(v){ S.settings.weekStart=+v; ui.weekOffset=0; resyncAllPaid(); save(); render(); }
function onCurSym(v){ S.settings.currencySymbol=(v||"").trim()||"$"; save(); render(); }
function setTheme(v){ S.settings.theme=v; save(); render(); }
/* re-sync every paid week (rate or week-start may have changed) */
function resyncAllPaid(){
  var seen={};
  Object.keys(S.weekPayStatus).forEach(function(wk){ if(S.weekPayStatus[wk]==="paid"){ seen[wk]=1; syncPaidWeek(wk); } });
  /* drop orphan auto entries whose week is no longer paid */
  S.income=S.income.filter(function(e){
    return !(e.source==="work-week" && !seen[e.sourceKey]);
  });
}
function downloadBackup(){
  var data={ exportedAt:new Date().toISOString(), app:"Weekly Work Tracker", state:S };
  downloadFile("work-tracker-backup-"+dateKey(new Date())+".json", JSON.stringify(data,null,2), "application/json");
}
function restoreFile(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      var st=d&&d.state?d.state:d;
      st=normalize(st);
      var msg="Backup contents:\n"+
        "• "+st.work.length+" work shifts\n"+
        "• "+st.income.length+" income entries\n"+
        "• "+st.expenses.length+" expenses\n"+
        (d&&d.exportedAt?"• Exported: "+d.exportedAt:"")+
        "\nReplace ALL current data with this backup?";
      if(!confirm(msg)) return;
      S=st; resyncAllPaid(); save(); render();
      alert("Backup restored.");
    }catch(e){ alert("Could not read that backup file."); }
    inp.value="";
  };
  r.readAsText(f);
}

/* ============ BOTTOM SHEET editor ============ */
function openSheet(dk, entry){
  var e=entry||entryForDate(dk);
  sheet={ date:dk,
    start:e?e.start:"",
    end:e?e.end:"",
    breakMinutes:e?+e.breakMinutes||0:0,
    rate:e&&e.rate!=null?+e.rate:S.settings.hourlyRate,
    editingId:e?e.id:null, showMore:false };
  renderSheet();
  document.getElementById("sheetBack").classList.add("open");
  document.getElementById("sheet").classList.add("open");
}
function closeSheet(){
  sheet=null;
  document.getElementById("sheetBack").classList.remove("open");
  document.getElementById("sheet").classList.remove("open");
}
function renderSheet(){
  if(!sheet) return;
  var d=parseKey(sheet.date);
  var title=sheet.editingId ? DAYS[d.getDay()]+", "+MONTHS[d.getMonth()]+" "+d.getDate()
                            : "Add hours · "+DAYS[d.getDay()]+", "+MONTHS[d.getMonth()]+" "+d.getDate();
  var more=sheet.showMore?
    '<div class="morewrap">'+
    '<div class="field"><label>Date</label><input type="date" id="shDate" value="'+esc(sheet.date)+'" onchange="shSet(\'date\',this.value)"></div>'+
    '<div class="field"><label>Break (minutes)</label><input type="number" id="shBreak" min="0" inputmode="numeric" value="'+sheet.breakMinutes+'" onchange="shSetNum(\'breakMinutes\',this.value)"></div>'+
    '<div class="field"><label>Hourly rate</label><input type="number" id="shRate" min="0" step="0.5" inputmode="decimal" value="'+sheet.rate+'" onchange="shSetNum(\'rate\',this.value)"></div>'+
    '</div>' :
    '<div style="text-align:center;margin-top:4px"><button class="linkbtn" onclick="sheet.showMore=true;renderSheet()">More options</button></div>';
  var delBtn=sheet.editingId?
    '<div style="text-align:center;margin-top:10px"><button class="linkbtn" style="color:var(--danger)" onclick="delSheetDay()">Delete this day</button></div>':"";
  document.getElementById("sheetBody").innerHTML=
    '<h3>'+esc(title)+'</h3>'+
    '<div class="grid2" style="margin-bottom:12px">'+
      '<div class="field" style="margin:0"><label>Start time</label>'+
        '<input type="time" id="shStart" value="'+esc(sheet.start)+'" oninput="shSet(\'start\',this.value)"></div>'+
      '<div class="field" style="margin:0"><label>End time</label>'+
        '<input type="time" id="shEnd" value="'+esc(sheet.end)+'" oninput="shSet(\'end\',this.value)"></div>'+
    '</div>'+
    '<div class="previewbox"><div class="pk">Preview</div><div class="pv" id="shPreview">–</div></div>'+
    '<button class="btn" onclick="saveSheet()">Save shift</button>'+
    '<div style="height:8px"></div>'+
    '<button class="btn ghost" onclick="closeSheet()">Cancel</button>'+
    more+delBtn;
  updateSheetPreview();
}
function shSet(k,v){ sheet[k]=v; updateSheetPreview(); }
function shSetNum(k,v){ sheet[k]=Math.max(0,+v||0); if(k==="rate"&&!(+v>0)) sheet[k]=S.settings.hourlyRate; updateSheetPreview(); }
function updateSheetPreview(){
  var el=document.getElementById("shPreview"); if(!el||!sheet) return;
  var c=dayCalc({start:sheet.start,end:sheet.end,breakMinutes:sheet.breakMinutes}, sheet.rate);
  el.textContent = c ? fmtDur(c.mins)+" · "+fmtMoney(c.pay) : "Set start & end time";
}
function saveSheet(){
  if(!sheet) return;
  if(!sheet.start||!sheet.end){ alert("Please set both start and end time."); return; }
  var dk=sheet.date;
  S.work=S.work.filter(function(w){ return !(w.date===dk || (sheet.editingId&&w.id===sheet.editingId)); });
  S.work.push({ id:sheet.editingId||uid(), date:dk, start:sheet.start, end:sheet.end,
    breakMinutes:Math.max(0,Math.round(+sheet.breakMinutes||0)), rate:+sheet.rate>0?+sheet.rate:S.settings.hourlyRate });
  syncPaidWeek(weekKeyOf(parseKey(dk), S.settings.weekStart));
  save(); closeSheet(); render();
}
function delSheetDay(){
  if(!sheet||!sheet.editingId) return;
  if(!confirm("Delete this day's shift?")) return;
  var dk=sheet.date;
  S.work=S.work.filter(function(w){ return w.id!==sheet.editingId; });
  syncPaidWeek(weekKeyOf(parseKey(dk), S.settings.weekStart));
  save(); closeSheet(); render();
}
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeSheet(); });

/* ============ init ============ */
save();
render();
</script>
